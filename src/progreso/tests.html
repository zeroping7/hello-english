<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pruebas: progreso</title>
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/app.css">
</head>
<body>
  <div id="app">
    <h1 class="logo">tests/progreso</h1>
  </div>
  <script type="module">
    import { prueba, igual, verdadero, ejecutar } from '../pruebas/mini.js';
    import { crearAlmacen } from './almacen.js';
    import { normalizarAjustes } from '../ajustes/ajustes.js';
    import * as L from './logica.js';
    import { comprobarLogros, LOGROS } from './logros.js';
    import { elegirPractica, practicaDeHoy, marcarHecho, siguientePaso } from './practica.js';

    // Almacenamiento falso con la misma interfaz que localStorage
    class Falso {
      constructor({ fallaAlGuardar = false } = {}) { this.datos = new Map(); this.falla = fallaAlGuardar; }
      get length() { return this.datos.size; }
      key(i) { return [...this.datos.keys()][i] ?? null; }
      getItem(k) { return this.datos.has(k) ? this.datos.get(k) : null; }
      setItem(k, v) { if (this.falla) throw new Error('QuotaExceededError'); this.datos.set(k, String(v)); }
      removeItem(k) { this.datos.delete(k); }
    }

    const nuevo = () => ({ v: 2, puntos: 0 });

    // --- Almacén (T010) ---

    prueba('Almacén: sin nada guardado devuelve los datos por defecto', () => {
      const a = crearAlmacen(new Falso());
      igual(a.leer('he-x', 2, nuevo), { v: 2, puntos: 0 });
    });

    prueba('Almacén: guarda y lee con su versión', () => {
      const disco = new Falso();
      const a = crearAlmacen(disco);
      a.guardar('he-x', { v: 2, puntos: 30 });
      igual(JSON.parse(disco.getItem('he-x')), { v: 2, puntos: 30 });
      igual(crearAlmacen(disco).leer('he-x', 2, nuevo), { v: 2, puntos: 30 });
    });

    prueba('Almacén: migra paso a paso desde una versión antigua', () => {
      const disco = new Falso();
      disco.setItem('he-x', JSON.stringify({ v: 0, xp: 5 }));
      const migraciones = {
        0: ({ xp }) => ({ puntos: xp }),
        1: (d) => ({ ...d, puntos: d.puntos * 10 }),
      };
      igual(crearAlmacen(disco).leer('he-x', 2, nuevo, migraciones), { puntos: 50, v: 2 });
    });

    prueba('Almacén: sin migración para una versión antigua usa los datos por defecto', () => {
      const disco = new Falso();
      disco.setItem('he-x', JSON.stringify({ v: 1, puntos: 7 }));
      igual(crearAlmacen(disco).leer('he-x', 2, nuevo), { v: 2, puntos: 0 });
    });

    prueba('Almacén: datos de una versión futura no se interpretan ni se borran', () => {
      const disco = new Falso();
      disco.setItem('he-x', JSON.stringify({ v: 9, otra: 'cosa' }));
      igual(crearAlmacen(disco).leer('he-x', 2, nuevo), { v: 2, puntos: 0 });
      igual(JSON.parse(disco.getItem('he-x')), { v: 9, otra: 'cosa' });
    });

    prueba('Almacén: JSON roto o sin versión usa los datos por defecto', () => {
      const disco = new Falso();
      disco.setItem('he-a', '{roto');
      disco.setItem('he-b', JSON.stringify({ puntos: 3 }));
      const a = crearAlmacen(disco);
      igual(a.leer('he-a', 2, nuevo), nuevo());
      igual(a.leer('he-b', 2, nuevo), nuevo());
    });

    prueba('Almacén: sin disco funciona en memoria y no es persistente', () => {
      const a = crearAlmacen(null);
      verdadero(!a.persistente(), 'debería decir que no es persistente');
      a.guardar('he-x', { v: 2, puntos: 4 });
      igual(a.leer('he-x', 2, nuevo), { v: 2, puntos: 4 });
    });

    prueba('Almacén: si el disco falla al guardar, sigue en memoria', () => {
      const a = crearAlmacen(new Falso({ fallaAlGuardar: true }));
      verdadero(a.persistente(), 'al principio cree que sí');
      a.guardar('he-x', { v: 2, puntos: 8 });
      verdadero(!a.persistente(), 'tras el fallo ya no es persistente');
      igual(a.leer('he-x', 2, nuevo), { v: 2, puntos: 8 });
    });

    prueba('Almacén: borrarTodo solo borra las claves he-*', () => {
      const disco = new Falso();
      const a = crearAlmacen(disco);
      a.guardar('he-ajustes', { v: 1 });
      a.guardar('he-progreso', { v: 1 });
      disco.setItem('otra-app', 'x');
      a.borrarTodo();
      igual([...disco.datos.keys()], ['otra-app']);
    });

    // --- Lógica del progreso (T020) ---

    prueba('Puntos: 10 por acierto en A1 y dificultad 1', () => {
      igual(L.puntosPorAcierto('A1'), 10);
    });

    prueba('Puntos: multiplican el nivel y la dificultad (D-010)', () => {
      igual(['A1', 'A2', 'B1', 'B2', 'C1'].map((n) => L.puntosPorAcierto(n)), [10, 12, 15, 18, 20]);
      igual(L.puntosPorAcierto('B1', 1.5), 23);
      igual(L.puntosPorAcierto('C1', 1.5), 30);
    });

    prueba('Puntos: sumarPuntos no acepta negativos', () => {
      igual(L.sumarPuntos({ ...L.progresoNuevo(), puntos: 5 }, -20).puntos, 5);
    });

    prueba('Fechas: día anterior cruzando mes, año y bisiesto', () => {
      igual(L.diaAnterior('2026-03-01'), '2026-02-28');
      igual(L.diaAnterior('2028-03-01'), '2028-02-29');
      igual(L.diaAnterior('2027-01-01'), '2026-12-31');
      igual(L.sumarDias('2026-10-31', 1), '2026-11-01');
    });

    prueba('Objetivo: sumar segundos acumula en el día', () => {
      let p = L.progresoNuevo();
      p = L.sumarSegundos(p, '2026-10-28', 60, 10).progreso;
      p = L.sumarSegundos(p, '2026-10-28', 90, 10).progreso;
      igual(L.segundosHoy(p, '2026-10-28'), 150);
      igual(L.segundosHoy(p, '2026-10-29'), 0);
    });

    prueba('Objetivo: se cumple una sola vez al día', () => {
      let p = L.progresoNuevo();
      let r = L.sumarSegundos(p, '2026-10-28', 299, 5);
      igual(r.cumplidoAhora, false);
      r = L.sumarSegundos(r.progreso, '2026-10-28', 1, 5);
      igual([r.cumplidoAhora, r.progreso.racha], [true, 1]);
      r = L.sumarSegundos(r.progreso, '2026-10-28', 600, 5);
      igual([r.cumplidoAhora, r.progreso.racha], [false, 1]);
    });

    prueba('Racha: sube con días seguidos', () => {
      let p = L.progresoNuevo();
      for (const dia of ['2026-10-27', '2026-10-28', '2026-10-29']) p = L.sumarSegundos(p, dia, 300, 5).progreso;
      igual([p.racha, p.ultimoDiaCumplido], [3, '2026-10-29']);
    });

    prueba('Racha: si se salta un día vuelve a 1 al cumplir', () => {
      let p = L.progresoNuevo();
      p = L.sumarSegundos(p, '2026-10-27', 300, 5).progreso;
      p = L.sumarSegundos(p, '2026-10-28', 300, 5).progreso;
      p = L.sumarSegundos(p, '2026-10-30', 300, 5).progreso;
      igual(p.racha, 1);
    });

    prueba('Racha visible: se mantiene hoy y mañana, y es 0 después', () => {
      let p = L.sumarSegundos(L.progresoNuevo(), '2026-10-28', 300, 5).progreso;
      igual(L.rachaVisible(p, '2026-10-28'), 1);
      igual(L.rachaVisible(p, '2026-10-29'), 1);
      igual(L.rachaVisible(p, '2026-10-30'), 0);
    });

    prueba('Racha: si se baja el objetivo con el tiempo ya hecho, cuenta al sumar más', () => {
      let r = L.sumarSegundos(L.progresoNuevo(), '2026-10-28', 400, 10);
      igual(r.cumplidoAhora, false);
      r = L.sumarSegundos(r.progreso, '2026-10-28', 1, 5);
      igual([r.cumplidoAhora, r.progreso.racha], [true, 1]);
    });

    prueba('Días: solo se guardan los últimos 60', () => {
      const dias = { '2026-08-29': 10, '2026-08-30': 20, '2026-10-28': 30 };
      igual(Object.keys(L.podarDias(dias, '2026-10-28')), ['2026-08-30', '2026-10-28']);
    });

    prueba('Lógica: no modifica el progreso que recibe', () => {
      const p = L.progresoNuevo();
      L.sumarSegundos(p, '2026-10-28', 300, 5);
      igual(p, L.progresoNuevo());
    });

    // --- Exportar e importar (T023) ---

    const conDatos = () => {
      let p = L.sumarSegundos(L.progresoNuevo(), '2026-10-28', 600, 10).progreso;
      return L.sumarPuntos(p, 120);
    };

    prueba('Exportar → importar devuelve lo mismo', () => {
      const ajustes = { v: 1, idioma: 'en', tema: 'oscuro' };
      const archivo = JSON.parse(JSON.stringify(L.crearExportacion(ajustes, conDatos(), new Date('2026-10-28T10:00:00Z'))));
      igual([archivo.app, archivo.formato, archivo.exportado], ['hello-english', 1, '2026-10-28T10:00:00.000Z']);
      const r = L.validarImportacion(archivo);
      igual(r.ok, true);
      igual(r.progreso, conDatos());
      igual(r.ajustes, ajustes);
    });

    prueba('Importar: rechaza archivos de otra app o vacíos', () => {
      igual(L.validarImportacion({ app: 'otra', formato: 1 }).ok, false);
      igual(L.validarImportacion(null).ok, false);
      igual(L.validarImportacion([]).ok, false);
    });

    prueba('Importar: rechaza un formato o un progreso de una versión futura', () => {
      const base = L.crearExportacion({ v: 1 }, conDatos());
      igual(L.validarImportacion({ ...base, formato: 2 }).motivo, 'formato');
      igual(L.validarImportacion({ ...base, progreso: { ...conDatos(), v: 9 } }).motivo, 'progreso');
    });

    prueba('Importar: rechaza tipos y valores erróneos', () => {
      const base = L.crearExportacion({ v: 1 }, conDatos());
      const malos = [
        { nivel: 'Z9' }, { puntos: -5 }, { puntos: '100' }, { racha: 1.5 },
        { ultimoDiaCumplido: 'ayer' }, { dias: [] }, { dias: { 'no-fecha': 3 } }, { dias: { '2026-10-28': -1 } },
        { nivelProbado: 'si' },
      ];
      for (const cambio of malos) {
        igual(L.validarImportacion({ ...base, progreso: { ...conDatos(), ...cambio } }).ok, false, JSON.stringify(cambio));
      }
    });

    prueba('Importar: descarta campos desconocidos del progreso', () => {
      const base = L.crearExportacion({ v: 1 }, { ...conDatos(), trampa: true });
      igual('trampa' in L.validarImportacion(base).progreso, false);
    });

    // --- Formato v2 (specs 022-025) ---

    prueba('Migración v1 → v2: añade repaso, estadísticas y logros sin perder nada', () => {
      const v1 = { v: 1, nivel: 'B1', nivelProbado: true, puntos: 300, dias: { '2026-10-27': 600 }, ultimoDiaCumplido: '2026-10-27', racha: 4 };
      const v2 = { ...L.MIGRACIONES_PROGRESO[1](v1), v: 2 };
      igual([v2.nivel, v2.puntos, v2.racha, v2.stats.rachaMax, v2.stats.partidas], ['B1', 300, 4, 4, 0]);
      igual([v2.repaso, v2.logros, v2.ventana, v2.practica], [{}, {}, [], null]);
    });

    prueba('Importar: un archivo v1 se migra; uno v2 conserva repaso y logros válidos', () => {
      const v1 = { v: 1, nivel: 'A2', nivelProbado: false, puntos: 10, dias: {}, ultimoDiaCumplido: null, racha: 0 };
      igual(L.validarImportacion({ app: 'hello-english', formato: 1, ajustes: {}, progreso: v1 }).progreso.v, 2);
      const p = { ...L.progresoNuevo(), repaso: { 'fa-001': { c: 1, p: '2026-10-29' }, 'mal': { c: 9, p: 'x' } }, logros: { 'perfecta': '2026-10-28', 'x': 3 } };
      const r = L.validarImportacion(L.crearExportacion({}, p));
      igual([Object.keys(r.progreso.repaso), Object.keys(r.progreso.logros)], [['fa-001'], ['perfecta']]);
    });

    prueba('Repaso: un fallo se repasa mañana; aciertos lo suben de caja hasta aprenderlo', () => {
      let p = L.anotarRepaso(L.progresoNuevo(), 'fa-001', false, '2026-10-28');
      igual(p.repaso['fa-001'], { c: 0, p: '2026-10-29' });
      igual(L.repasosPendientes(p, '2026-10-28'), []);
      igual(L.repasosPendientes(p, '2026-10-29', 'fa'), ['fa-001']);
      igual(L.repasosPendientes(p, '2026-10-29', 'mc'), []);
      p = L.anotarRepaso(p, 'fa-001', true, '2026-10-29');
      igual(p.repaso['fa-001'], { c: 1, p: '2026-11-01' });
      p = L.anotarRepaso(p, 'fa-001', true, '2026-11-01');
      igual(p.repaso['fa-001'], { c: 2, p: '2026-11-08' });
      p = L.anotarRepaso(p, 'fa-001', true, '2026-11-08');
      igual(['fa-001' in p.repaso, p.stats.aprendidos], [false, 1]);
    });

    prueba('Repaso: acertar uno que no se ha fallado o que aún no toca no cambia nada', () => {
      const p0 = L.progresoNuevo();
      igual(L.anotarRepaso(p0, 'mc-001', true, '2026-10-28'), p0);
      const p1 = L.anotarRepaso(p0, 'mc-001', false, '2026-10-28');
      igual(L.anotarRepaso(p1, 'mc-001', true, '2026-10-28'), p1);
    });

    prueba('Nivel: con 16 de los últimos 20 bien en tu nivel, sube uno', () => {
      let p = { ...L.progresoNuevo(), nivel: 'A2' };
      let r;
      for (let i = 0; i < 20; i++) {
        r = L.anotarNivel(p, 'A2', i % 5 !== 0);   // 16 aciertos y 4 fallos
        p = r.progreso;
      }
      igual([r.sube, p.nivel, p.ventana.length], [true, 'B1', 0]);
    });

    prueba('Nivel: menos de 16 de 20, otro nivel o C1 no suben', () => {
      let p = { ...L.progresoNuevo(), nivel: 'A2' };
      for (let i = 0; i < 20; i++) p = L.anotarNivel(p, 'A2', i % 4 !== 0).progreso;   // 15 de 20
      igual(p.nivel, 'A2');
      igual(L.anotarNivel(p, 'B1', true).progreso.ventana.length, 20);
      let c = { ...L.progresoNuevo(), nivel: 'C1' };
      for (let i = 0; i < 25; i++) c = L.anotarNivel(c, 'C1', true).progreso;
      igual(c.nivel, 'C1');
    });

    prueba('Partidas: cuenta partidas, perfectas y por minijuego', () => {
      let p = L.anotarPartida(L.progresoNuevo(), 'prompt', 8, 8);
      p = L.anotarPartida(p, 'prompt', 5, 8);
      igual([p.stats.partidas, p.stats.perfectas, p.stats.juegos.prompt], [2, 1, 2]);
    });

    prueba('Logros: se apuntan una sola vez, con la fecha', () => {
      const juegos = [{ id: 'a', categoria: 'lectura' }];
      const p = L.anotarPartida(L.progresoNuevo(), 'a', 3, 3);
      const r1 = comprobarLogros(p, '2026-10-28', { juegos });
      verdadero(r1.nuevos.includes('primera-partida') && r1.nuevos.includes('perfecta') && r1.nuevos.includes('todos-los-juegos'), r1.nuevos.join());
      igual(r1.progreso.logros['primera-partida'], '2026-10-28');
      igual(comprobarLogros(r1.progreso, '2026-10-29', { juegos }).nuevos, []);
      igual(new Set(LOGROS.map((l) => l.id)).size, LOGROS.length);
    });

    // --- Práctica de hoy (spec 024) ---

    const juegosPrueba = [
      { id: 'a', categoria: 'lectura', prefijo: 'aa' }, { id: 'b', categoria: 'lectura', prefijo: 'bb' },
      { id: 'c', categoria: 'escucha', prefijo: 'cc' }, { id: 'd', categoria: 'vocabulario', prefijo: 'dd' },
      { id: 'e', categoria: 'profesional', prefijo: 'ee' },
    ];

    prueba('Práctica: 3 minijuegos distintos, de categorías distintas, iguales todo el día', () => {
      const a = elegirPractica('2026-10-28', juegosPrueba, {}, {});
      igual(a, elegirPractica('2026-10-28', juegosPrueba, {}, {}));
      igual(new Set(a).size, 3);
      igual(new Set(a.map((id) => juegosPrueba.find((j) => j.id === id).categoria)).size, 3);
    });

    prueba('Práctica: empieza por el que tiene más repasos y prefiere los menos jugados', () => {
      igual(elegirPractica('2026-10-28', juegosPrueba, { cc: 5, dd: 2 }, {})[0], 'c');
      const r = elegirPractica('2026-10-28', juegosPrueba, {}, { a: 9, b: 9, c: 9 });
      verdadero(r.includes('d') && r.includes('e'), r.join());
    });

    prueba('Práctica: se marca cada paso y avisa al completar la última', () => {
      let pr = practicaDeHoy(null, '2026-10-28', () => ['a', 'c', 'd']);
      igual(practicaDeHoy(pr, '2026-10-28', () => ['x']), pr);
      igual(practicaDeHoy(pr, '2026-10-29', () => ['x']).juegos, ['x']);
      let r = marcarHecho(pr, 'c');
      igual([r.completaAhora, siguientePaso(r.practica)], [false, 'a']);
      r = marcarHecho(r.practica, 'a');
      r = marcarHecho(r.practica, 'd');
      igual([r.completaAhora, siguientePaso(r.practica)], [true, null]);
      igual(marcarHecho(r.practica, 'd').completaAhora, false);
    });

    // --- Ajustes (T011) ---

    const base = { v: 1, idioma: 'es', tema: 'sistema', acento: 'gb', velocidad: 'normal',
      sonido: true, vibracion: true, objetivoMin: 10, bienvenidaHecha: false };

    prueba('Ajustes: sin datos se usan los valores por defecto', () => {
      igual(normalizarAjustes(null, base), base);
    });

    prueba('Ajustes: se conservan los valores válidos', () => {
      const r = normalizarAjustes({ v: 1, idioma: 'en', tema: 'oscuro', objetivoMin: 20, sonido: false }, base);
      igual([r.idioma, r.tema, r.objetivoMin, r.sonido, r.acento], ['en', 'oscuro', 20, false, 'gb']);
    });

    prueba('Ajustes: valores no válidos y claves desconocidas se descartan', () => {
      const r = normalizarAjustes({ v: 1, idioma: 'fr', tema: 'rosa', objetivoMin: '5', extra: 1 }, base);
      igual(r, base);
    });

    ejecutar(document.getElementById('app'));
  </script>
</body>
</html>
